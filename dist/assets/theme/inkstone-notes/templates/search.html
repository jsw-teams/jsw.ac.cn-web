<main id="main" class="page-main search-main">
  <h1 class="page-title">{{title}}</h1>
  <section class="search-panel" data-search-root>
    <label for="search-input">关键词</label>
    <input id="search-input" class="search-input" data-search-input type="search" autocomplete="off" placeholder="输入关键词">
    <p class="search-status" data-search-status>搜索索引加载中。</p>
    <div class="search-results post-list" data-search-results></div>
  </section>
</main>
