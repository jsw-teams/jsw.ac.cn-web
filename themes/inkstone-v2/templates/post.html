<main id="main" class="site-main article-main">
  <article class="article-shell">
    <header class="article-header">
      <p class="eyebrow">TECHNICAL NOTE</p>
      <h1>{{title}}</h1>
      <p class="article-dek">{{description}}</p>
      <div class="article-meta">
        <span><time datetime="{{date}}">{{date}}</time></span>
        <span>分类 <a href="{{categoryUrl}}">{{category}}</a></span>
        <div class="tag-row">{{{tags}}}</div>
      </div>
    </header>
    <div class="prose">
      {{{content}}}
    </div>
  </article>
</main>
