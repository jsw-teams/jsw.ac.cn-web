<main id="main" class="site-main home-main">
  <section class="home-hero">
    <div class="hero-copy">
      <p class="eyebrow">INKSTONE / TECHNICAL NOTES</p>
      <h1>{{siteName}}</h1>
      <p class="hero-dek">{{description}}</p>
      <div class="hero-actions">
        <a class="button-primary" href="/archives/">浏览归档</a>
        <a class="button-quiet" href="/about/">关于本站</a>
      </div>
    </div>
    <picture class="hero-mascot">
      <source srcset="/assets/theme/inkstone-v2/source-assets/jie-paopao-mascot.webp" type="image/webp">
      <img src="/assets/theme/inkstone-v2/source-assets/jie-paopao-mascot.png" alt="颉泡泡正在记笔记" width="720" height="760" decoding="async" fetchpriority="high">
    </picture>
  </section>
  <section class="home-feed" aria-labelledby="latest-title">
    <div class="section-head">
      <div>
        <p class="eyebrow">RECENT</p>
        <h2 id="latest-title">最近更新</h2>
      </div>
      <a href="/archives/">全部文章 ↗</a>
    </div>
    {{{latestPosts}}}
  </section>
</main>
